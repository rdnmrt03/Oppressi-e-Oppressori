<!doctype html><meta charset="utf-8"><title>Verifica multiplayer</title><pre id="result">Test in corso…</pre><script src="engine.js"></script><script src="online-core.js"></script><script>
let checks=0,games=0;const R=OnlineRules,E=Engine;function ok(v,m){checks++;if(!v)throw Error(m)}function reject(fn,m){let failed=false;try{fn()}catch{failed=true}ok(failed,m)}
try{
 for(const n of [15,16,21,30])for(const humans of [2,n]){
  let room=R.create('host','Facilitatore',n,'Valleverde');reject(()=>R.start(room,'host',1),'Non avvia senza ospiti');
  for(let i=1;i<humans;i++)room=R.join(room,'guest'+i,'Ospite '+i);
  ok(R.join(room,'guest1','Altro nome').revision===room.revision,'Rientro idempotente');
  reject(()=>R.start(room,'guest1',1),'Avvio solo host');let s=R.start(room,'host',31+n);room.phase='playing';room.revision++;
  reject(()=>R.join(room,'estraneo','Nuovo'),'Ingresso chiuso dopo avvio');
  let guard=0;
  while(s.act<7){ok(++guard<400,'Partita termina');let action,value,uid;
   if(s.act===1){action='place';value='Un luogo condiviso';uid='host'}
   if(s.act===2){action='daily';value='help';uid=s.people[s.step].ownerUid}
   if(s.act===3){action='accuse';value=E.accusationTargets(s)[0];uid=s.people[R.active(s)].ownerUid}
   if([4,5].includes(s.act)){
    const sc=s.scene;if(sc.stage==='target'){action='target';value=E.targets(s)[0];uid=s.people[sc.actor].ownerUid}
    if(sc.stage==='response'){action='obey';value=null;uid=s.people[sc.target].ownerUid}
    if(sc.stage==='intervene'){if(s.giusti.length){action='intervene';value=E.witnesses(s)[0];uid=s.people[value].ownerUid}else{action='pass';value=null;uid='host'}}
    if(sc.stage==='result'){action='next';value=null;uid='host'}
   }
   if(s.act===6){action='vote';value=s.step%2===0;uid=s.people[s.step].ownerUid}
   const command={uid,action,value,revision:room.revision};
   reject(()=>R.apply(room,s,{...command,uid:'estraneo'}),'Estraneo non può agire');
   reject(()=>R.apply(room,s,{...command,revision:room.revision-1}),'Revisione vecchia respinta');
   const other=room.memberIds.find(id=>id!==uid);reject(()=>R.apply(room,s,{...command,uid:other}),'Altro giocatore non può agire');
   const before=JSON.stringify(s);const next=R.apply(room,s,command);ok(JSON.stringify(s)===before,'Stato input immutato');s=next;room.revision++;
   const pub=JSON.parse(R.publish(s));ok(!('seed' in pub),'Seed non pubblico');ok(pub.giusti.every(c=>c.hidden&&!c.title),'Mazzo non svelato');if(s.act<7)ok(pub.votes.length===0,'Voti nascosti prima epilogo');
   reject(()=>R.apply(room,s,command),'Doppio invio non ripete azione');
  }
  ok(JSON.parse(R.publish(s)).votes.length===n,'Voti visibili alla fine');games++;
 }
 document.querySelector('#result').textContent='PASS ONLINE CORE · '+games+' partite · '+checks+' controlli';
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack}
</script>
